<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Offline — Museum Virtual Universitas Diponegoro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #0B1F3A 0%, #061324 100%);
      color: #F5EFE0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      max-width: 480px;
      width: 100%;
      background: rgba(11, 31, 58, 0.75);
      border: 1px solid rgba(201, 162, 75, 0.4);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .emblem {
      font-size: 3rem;
      margin-bottom: 16px;
      display: inline-block;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0B1F3A;
      background: #C9A24B;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #FFD700;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }
    p {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #CBD5E1;
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-block;
      padding: 12px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #0B1F3A;
      background: linear-gradient(135deg, #C9A24B 0%, #E8C56E 100%);
      border: 1px solid #FFD700;
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(201, 162, 75, 0.35);
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(201, 162, 75, 0.5);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="emblem">🏛️</div>
    <div><span class="badge">Museum Virtual Undip</span></div>
    <h1>Anda Sedang Tidak Terhubung ke Internet</h1>
    <p>
      Halaman ini belum tersimpan di memori cache peramban Anda. Silakan periksa kembali koneksi internet Anda atau muat ulang setelah terhubung.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">
      Muat Ulang Halaman
    </button>
  </div>
</body>
</html>
